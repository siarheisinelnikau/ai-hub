name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: Install test dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: CI gate (scripts/check.py)
      run: python scripts/check.py
    - name: Race detector
      if: runner.os == 'Linux'
      run: go test -race -count=1 -timeout 120s ./...
    - name: Vulnerability scan
      if: runner.os == 'Linux'
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    - name: Secret scan
      if: runner.os == 'Linux'
      run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
    - name: Upload parity logs on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: parity-logs-${{ runner.os }}
        path: |
          ${{ runner.temp }}/opencode/parity_py.log
          ${{ runner.temp }}/opencode/parity_go.log
        if-no-files-found: ignore
    permissions:
      contents: read
  package:
    needs:
    - test
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - name: Build both commands without dirtying their VCS metadata
      run: |
        go build -mod=readonly -trimpath -buildvcs=true -o "$RUNNER_TEMP/aihub-linux" ./cmd/aihub
        go build -mod=readonly -trimpath -buildvcs=true -o "$RUNNER_TEMP/mcp-linux" ./cmd/mcp
        timeout 5s "$RUNNER_TEMP/aihub-linux" --version
        timeout 5s "$RUNNER_TEMP/mcp-linux" --version
        python3 release/package_go.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ai-hub-linux-amd64
        path: dist/*
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 30
