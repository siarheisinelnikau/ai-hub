name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Use the same portable validation entry point locally and in CI.
      - name: CI gate (scripts/check.py)
        run: python scripts/check.py

      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout 120s ./...

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Secret scan
        if: runner.os == 'Linux'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner

      - name: Upload parity logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-logs-${{ runner.os }}
          path: |
            ${{ runner.temp }}/opencode/parity_py.log
            ${{ runner.temp }}/opencode/parity_go.log
          if-no-files-found: ignore
