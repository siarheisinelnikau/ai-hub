<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- light rounded square with dark border for contrast on both themes -->
  <rect x="8" y="8" width="496" height="496" rx="128" fill="url(#bg)" stroke="#0f172a" stroke-width="12" filter="url(#shadow)"/>
  <!-- inner subtle border -->
  <rect x="14" y="14" width="484" height="484" rx="122" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8"/>
  <!-- hub lines -->
  <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="156" y1="156" x2="256" y2="256"/>
    <line x1="356" y1="156" x2="256" y2="256"/>
    <line x1="156" y1="356" x2="256" y2="256"/>
    <line x1="356" y1="356" x2="256" y2="256"/>
  </g>
  <!-- 4 GPU nodes - dark cards -->
  <g>
    <rect x="122" y="122" width="68" height="68" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="322" y="122" width="68" height="68" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="122" y="322" width="68" height="68" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="322" y="322" width="68" height="68" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="156" cy="156" r="9" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="356" cy="156" r="9" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="156" cy="356" r="9" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="356" cy="356" r="9" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- center hub - dark with light accent -->
  <g>
    <circle cx="256" cy="256" r="56" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <circle cx="256" cy="256" r="40" fill="none" stroke="#f8fafc" stroke-width="3.5" opacity="0.95"/>
    <circle cx="256" cy="256" r="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="256" cy="256" r="6" fill="#0f172a"/>
  </g>
  <!-- ai·hub text -->
  <g text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="256" y="438" font-size="44" font-weight="800" letter-spacing="-1.2" fill="#0f172a">ai·hub</text>
    <text x="256" y="462" font-size="11" font-weight="600" letter-spacing="2.5" fill="#64748b">4× RTX 3090</text>
  </g>
</svg>
