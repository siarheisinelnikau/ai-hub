<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- rounded square bg -->
  <rect width="512" height="512" rx="128" fill="url(#g)" stroke="#2a2d36" stroke-width="8"/>
  <!-- hub network: center + 4 nodes -->
  <g stroke="#2a2d36" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="156" y1="156" x2="256" y2="256"/>
    <line x1="356" y1="156" x2="256" y2="256"/>
    <line x1="156" y1="356" x2="256" y2="256"/>
    <line x1="356" y1="356" x2="256" y2="256"/>
  </g>
  <!-- 4 GPU nodes -->
  <g>
    <rect x="124" y="124" width="64" height="64" rx="16" fill="#1e2028" stroke="#343845" stroke-width="3"/>
    <rect x="324" y="124" width="64" height="64" rx="16" fill="#1e2028" stroke="#343845" stroke-width="3"/>
    <rect x="124" y="324" width="64" height="64" rx="16" fill="#1e2028" stroke="#343845" stroke-width="3"/>
    <rect x="324" y="324" width="64" height="64" rx="16" fill="#1e2028" stroke="#343845" stroke-width="3"/>
    <!-- small indicator inside each -->
    <circle cx="156" cy="156" r="8" fill="#22c55e" opacity="0.9"/>
    <circle cx="356" cy="156" r="8" fill="#22c55e" opacity="0.9"/>
    <circle cx="156" cy="356" r="8" fill="#22c55e" opacity="0.9"/>
    <circle cx="356" cy="356" r="8" fill="#22c55e" opacity="0.9"/>
  </g>
  <!-- center hub -->
  <g>
    <circle cx="256" cy="256" r="52" fill="#0f1115" stroke="#343845" stroke-width="4"/>
    <circle cx="256" cy="256" r="36" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
    <circle cx="256" cy="256" r="14" fill="#f8fafc"/>
  </g>
  <!-- ai text below hub -->
  <g text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="256" y="435" font-size="42" font-weight="800" letter-spacing="-1.5" fill="url(#accent)">ai·hub</text>
  </g>
</svg>
